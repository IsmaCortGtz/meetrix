name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  go-server:
    name: Go Server Tests & Race Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: server/go.sum

      - name: Run Unit Tests with Race Detector
        working-directory: server
        run: |
          go test -v -race ./...

  typescript-sdk:
    name: TypeScript SDK Build & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Typecheck Workspace
        run: npm run typecheck

      - name: Build Core SDK
        run: npm run build:core

      - name: Run Core Tests
        run: npm run test

  documentation:
    name: Documentation Verification Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build VitePress Documentation
        run: npm run docs:build
        env:
          VITEPRESS_BASE: '/connected/'
